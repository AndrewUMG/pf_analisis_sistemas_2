<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Reserva tu cita en Studio La Barber: cortes, barba y tratamientos con los mejores barberos. Elige servicio, barbero y horario en un minuto." />
    <meta property="og:title" content="Studio La Barber" />
    <meta property="og:description" content="Reserva en línea tu cita de corte, barba o tratamiento." />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio La Barber — Reserva tu cita en línea</title>
    <script>
      // Se aplica antes del primer paint para evitar el parpadeo de tema
      // incorrecto. El tema por defecto de la app es "light".
      try {
        var t = localStorage.getItem('tema');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
